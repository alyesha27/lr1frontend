<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Lab1</title>
</head>
<body>

<input type="text" id="inputField" placeholder="Введите текст">
<button id="send">Отправить</button>
<br><br>
<input type="text" id="readInput" placeholder="Введите текст">
<button id="sendAndRead">Отправить и/или вывести результат</button>
<textarea id="resultField" placeholder="Результат" readonly></textarea>

<script>
    document.getElementById("send").addEventListener("click", async () =>
    {
        const text = document.getElementById("inputField").value;

        await fetch("http://localhost:8080/save", {
            method: "POST",
            body: text
        });

        alert("Отправлено");
    });
    document.getElementById("sendAndRead").addEventListener("click", async () =>
    {
        const text = document.getElementById("readInput").value;

        await fetch("http://localhost:8080/save", {
            method: "POST",
            body: text
        });

        const response = await fetch("http://localhost:8080/read");
        const result = await response.text();
        document.getElementById("resultField").value = result;
    });
</script>

</body>
</html>
